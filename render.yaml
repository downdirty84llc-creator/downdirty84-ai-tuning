# Free Render compute with external Supabase Postgres and private S3 storage.
# Setup and limits: docs/FREE-DEPLOYMENT.md. Paid alternative: render.paid.yaml.
services:
  - type: web
    name: dd84-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # `start` runs migrations first, so a deploy that changes the schema
    # applies it before serving. The runner is idempotent and refuses to claim
    # success if a migration drifted.
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Who may release calibrations. Env-only on purpose: admin rights must
      # not be grantable by anything the application can write to.
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Sign-in is a magic link. With no transport nobody can log in at all, so
      # the server refuses to start in production without this.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Without S3, uploads land on a disk that is wiped on every deploy.
      # The server refuses to start in production without these.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: DD84_LINK_DEVICE_KEY
        sync: false
      - key: DD84_LINK_SIGNING_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: dd84-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      # Relative API requests keep the HttpOnly SameSite=Lax cookie first-party.
      - key: VITE_API_BASE_URL
        value: ""
    routes:
      # Keep this before the SPA fallback. Update the target if Render assigns
      # your API a different hostname. Do not weaken session cookie settings.
      - type: rewrite
        source: /api/*
        destination: https://dd84-api.onrender.com/api/*
      # Single-page app: every unmatched path serves index.html so a deep link
      # or a refresh does not 404.
      - type: rewrite
        source: /*
        destination: /index.html
