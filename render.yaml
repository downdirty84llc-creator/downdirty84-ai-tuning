# Render blueprint. `render.yaml` in the repo root lets Render provision the
# API, the static frontend and the database in one step.
#
# Secrets are marked sync:false — Render prompts for them rather than storing
# them here. Nothing secret belongs in a file that lives in git.

databases:
  - name: dd84-db
    databaseName: dd84
    plan: basic-256mb

services:
  - type: web
    name: dd84-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    # `start` runs migrations first, so a deploy that changes the schema
    # applies it before serving. The runner is idempotent and refuses to claim
    # success if a migration drifted.
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dd84-db
          property: connectionString
      # Who may release calibrations. Env-only on purpose: admin rights must
      # not be grantable by anything the application can write to.
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Without S3, uploads land on a disk that is wiped on every deploy.
      # The server refuses to start in production without these.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: dd84-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every unmatched path serves index.html so a deep link
      # or a refresh does not 404.
      - type: rewrite
        source: /*
        destination: /index.html
