name: Windows calibration studio
on:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/dd84-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/dd84-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run package
      - name: Install packaged GUI test driver
        run: npm ci
        working-directory: .
      - name: Verify native recovery, measured cases and saved files
        run: node scripts/test-native-studio.mjs products/dd84-desktop/dist/DD84-Calibration-Studio-win32-x64/DD84-Calibration-Studio.exe
        working-directory: .
        env:
          DD84_NATIVE_OUTPUT: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: DD84-native-acceptance
          path: |
            ${{ runner.temp }}/dd84-native-*/native-proof.json
            ${{ runner.temp }}/dd84-native-*/native-minimum-window.png
            ${{ runner.temp }}/dd84-native-*/native-case-*.json
            ${{ runner.temp }}/dd84-native-*/native-case-comparison.png
            ${{ runner.temp }}/dd84-native-*/native-workflow-*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: DD84-Calibration-Studio-Windows-x64-preview
          path: |
            products/dd84-desktop/dist/DD84-Calibration-Studio-win32-x64/
            products/dd84-desktop/dist/package-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Install isolated Windows distribution tools
        run: npm ci --ignore-scripts
        working-directory: tools/studio-installer
      - name: Audit Windows distribution tools
        run: npm audit --audit-level=low
        working-directory: tools/studio-installer
      - name: Verify distribution file policy
        run: node --test tools/studio-installer/payload-files.test.mjs tools/studio-installer/signing.test.mjs
        working-directory: .
        env:
          DD84_UNSIGNED_TEST_EXE: products/dd84-desktop/dist/DD84-Calibration-Studio-win32-x64/DD84-Calibration-Studio.exe
      - name: Build installer and portable ZIP from verified package
        run: node tools/studio-installer/build.mjs products/dd84-desktop/dist/DD84-Calibration-Studio-win32-x64 products/dd84-desktop/dist/distribution
        working-directory: .
        env:
          # A stale certificate setting must never change this unsigned build.
          WIN_CSC_LINK: deliberately-invalid-cached-certificate.pfx
          CSC_LINK: deliberately-invalid-cached-certificate.pfx
      - name: Verify install, reinstall, running-app protection and removal
        run: node scripts/test-studio-installer.mjs products/dd84-desktop/dist/distribution/distribution-manifest.json
        working-directory: .
        env:
          DD84_INSTALLER_OUTPUT: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: DD84-Windows-distribution-preview
          path: |
            products/dd84-desktop/dist/distribution/*-Setup.exe
            products/dd84-desktop/dist/distribution/*.zip
            products/dd84-desktop/dist/distribution/*.sha256
            products/dd84-desktop/dist/distribution/distribution-manifest.json
            ${{ runner.temp }}/dd84-installer-*/installer-proof.json
            ${{ runner.temp }}/dd84-installer-*/dd84-native-*/native-proof.json
            ${{ runner.temp }}/dd84-installer-*/dd84-native-*/native-workflow-*.json
          if-no-files-found: error
          retention-days: 14
