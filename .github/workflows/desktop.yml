name: Windows calibration studio
on:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/dd84-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/dd84-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: DD84-Calibration-Studio-Windows-x64-preview
          path: products/dd84-desktop/dist/DD84-Calibration-Studio-win32-x64/
          if-no-files-found: error
          retention-days: 14
