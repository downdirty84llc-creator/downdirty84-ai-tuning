name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, tests, migrations, e2e
    runs-on: ubuntu-latest

    # A real Postgres, so the migrations and the end-to-end run are exercised
    # against the database the app actually uses rather than a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dd84
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dd84
      ADMIN_EMAILS: admin@dd84.test
      NODE_ENV: test
      E2E_PGHOST: localhost
      E2E_PGPORT: '5432'
      E2E_PGDB: dd84
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Unit tests
        run: npm test
        working-directory: backend

      - name: Apply migrations from scratch
        run: |
          for f in migrations/*.sql; do
            echo "── $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: End-to-end pipeline
        run: |
          node dist/server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done
          npm run test:e2e
        working-directory: backend

      - name: DD84 LINK API integration
        run: npm run test:dd84-link
        working-directory: backend

      - name: DD84 LINK source simulator
        run: npm --prefix products/dd84-link test
        env:
          DD84_SANITIZE: '1'

      - name: DD84 LINK firmware fail-closed guard
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iproducts/dd84-link/firmware/include products/dd84-link/firmware/src/flash_guard.c products/dd84-link/firmware/host_flash_guard_test.c -o /tmp/dd84-flash-guard
          /tmp/dd84-flash-guard

      - name: DD84 LINK firmware startup gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iproducts/dd84-link/firmware/include products/dd84-link/firmware/src/app.c products/dd84-link/firmware/src/flash_guard.c products/dd84-link/firmware/host_startup_test.c -o /tmp/dd84-startup
          /tmp/dd84-startup
          cc -std=c11 -Wall -Wextra -Werror -Iproducts/dd84-link/firmware/include products/dd84-link/firmware/src/app.c products/dd84-link/firmware/src/main.c -o /tmp/dd84-scaffold

      - name: DD84 LINK CAN capture queue
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iproducts/dd84-link/firmware/include products/dd84-link/firmware/src/app.c products/dd84-link/firmware/src/flash_guard.c products/dd84-link/firmware/src/can_capture.c products/dd84-link/firmware/host_can_capture_test.c -o /tmp/dd84-capture
          /tmp/dd84-capture

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  guardrails:
    name: Safety guardrails still in place
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These are the controls the whole product depends on. A refactor that
      # quietly removes one would otherwise pass every other check — the code
      # would still compile and the tests would still be green, because the
      # tests for the removed behaviour would have gone with it.
      - name: Owner-release gate is enforced on every export path
        run: |
          test "$(grep -c 'assertReleased' backend/src/routes/exports.routes.ts)" -ge 3 \
            || { echo "::error::export routes no longer check the release gate"; exit 1; }

      - name: Release endpoint requires admin
        run: |
          grep -q 'requireAdmin' backend/src/routes/diffsets.routes.ts \
            || { echo "::error::the release endpoint is no longer admin-only"; exit 1; }

      - name: Diffgen refuses when safety is unevaluated
        run: |
          grep -q 'unevaluatedSafetyRules' backend/src/services/analyze/rules/index.ts \
            || { echo "::error::an unevaluated safety rule no longer blocks diffgen"; exit 1; }

      - name: MVP allowlist still restricts editable paths
        run: |
          grep -q 'Airflow.MAF.Curve' backend/src/services/diffgen/mvp_enforcement.ts \
            || { echo "::error::the MVP diff allowlist has been changed or removed"; exit 1; }

      # Sign-in is a magic link. If nothing sends it, nobody can log in and the
      # whole product is unreachable — a failure with no error message anywhere,
      # which is how it went unnoticed the first time.
      - name: Magic-link emails are actually sent
        run: |
          grep -q 'signInEmail' backend/src/services/auth/auth.service.ts \
            || { echo "::error::sign-in links are no longer emailed; nobody could log in"; exit 1; }

      - name: A release still tells the customer
        run: |
          grep -q 'reportReadyEmail' backend/src/routes/diffsets.routes.ts \
            || { echo "::error::releasing no longer notifies the customer"; exit 1; }

      # Money. A client that can name a Stripe price can check out against any
      # price on the account — including the $1-minimum donation price, or a
      # price from the other business line on the same account — and the
      # webhook would then create a full-price job for it.
      - name: Checkout maps service names to prices server-side
        run: |
          grep -q 'PRICE_FOR_SERVICE' backend/src/routes/checkout.routes.ts \
            || { echo "::error::checkout no longer resolves prices server-side; a client may be able to name its own price"; exit 1; }

      # A customer-facing page showing a price Stripe will not charge is the
      # same drift bug, pointed at buyers. Amounts come from Stripe at runtime
      # and are never committed to the repo.
      - name: Displayed prices come from Stripe, not from a hardcoded list
        run: |
          grep -q 'livePrices' backend/src/routes/checkout.routes.ts \
            || { echo "::error::the catalog no longer reads live prices; it may be advertising stale amounts"; exit 1; }

      # Classifying a payment by its amount was wrong four different ways
      # against the live account: two prices collide at $99, two at $39 across
      # business lines, and one service's amount was simply out of date.
      # Price IDs are minted per account, so a key for the wrong one of the four
      # accounts named "Down Dirty 84 llc" classifies nothing at all. The
      # symptom looks like a code bug; the cause is configuration.
      - name: The Stripe account behind the price IDs is asserted at boot
        run: |
          grep -q 'EXPECTED_STRIPE_ACCOUNT' backend/src/config/stripe_catalog.ts \
            || { echo "::error::the expected Stripe account is gone; a key for the wrong account would classify no payments"; exit 1; }
          grep -q 'verifyStripeAccount' backend/src/server.ts \
            || { echo "::error::the server no longer verifies which Stripe account its key belongs to"; exit 1; }

      - name: Payments are classified by price ID, not by amount
        run: |
          grep -q 'classifyCheckout' backend/src/routes/stripe.routes.ts \
            || { echo "::error::the webhook no longer classifies by price ID"; exit 1; }

      # A job that does not say what the car is must never be judged by an
      # owner-confirmed profile. Falling through to NA_GAS would put a boosted
      # E85 truck under gasoline thresholds, with the owner's signature on it
      # and no warning on the report.
      - name: Unknown platform falls back to the strictest thresholds
        run: |
          grep -q 'strictestAcrossProfiles' backend/src/config/thresholds.ts \
            || { echo "::error::the unknown-platform fallback is gone; unknown jobs may now be judged by a confirmed profile"; exit 1; }
